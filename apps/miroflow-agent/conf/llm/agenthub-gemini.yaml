# conf/llm/agenthub-gemini.yaml - AgentHub Gemini configuration
defaults:
  - default
  - _self_

provider: "agenthub"
model_name: "gemini-3-flash-preview"
client_type: "gemini-3"  # Optional: force specific client type
api_key: ${oc.env:GOOGLE_API_KEY}
base_url: null  # Use default
max_context_length: 1000000
max_tokens: 32768
temperature: 0.7
thinking_level: "low"  # none, low, medium, high
prompt_caching: "enable"
