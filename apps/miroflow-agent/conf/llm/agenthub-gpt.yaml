# conf/llm/agenthub-gpt.yaml - AgentHub GPT configuration
defaults:
  - default
  - _self_

provider: "agenthub"
model_name: "gpt-5.2"
client_type: "gpt-5.2"  # Optional: force specific client type
api_key: ${oc.env:OPENAI_API_KEY}
base_url: null  # Use default
max_context_length: 128000
max_tokens: 16384
temperature: 0.7
thinking_level: "none"  # GPT doesn't support thinking mode
prompt_caching: "enable"
